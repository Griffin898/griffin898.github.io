<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#86c375" />
    <title>Składanka dla Króliczka</title>
    <link rel="icon" href="./favicon.ico" />
    <style>
      :root { color: #5a3928; font-family: "Segoe UI", "Nunito", sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; background: #7fba6d; }
      button, a { font-family: inherit; }
      button:focus-visible, a:focus-visible { outline: 3px solid #ffe7a3; outline-offset: 2px; }
      .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
      .garden {
        min-height: 100vh; position: relative;
        background:
          radial-gradient(circle at 0 0, #b7e39a 0, transparent 32%),
          radial-gradient(circle at 100% 100%, #69a85a 0, transparent 36%),
          #86c375;
      }
      .vine { position: fixed; top: 0; height: 100%; width: min(140px, 16vw); pointer-events: none; z-index: 0; }
      .vine.left { left: 0; }
      .vine.right { right: 0; }
      .table { position: relative; z-index: 1; width: min(1040px, calc(100% - 16px)); margin: 0 auto; padding: 10px 0 16px; }
      .hud { display: grid; grid-template-columns: 64px 1fr 64px; gap: 8px; align-items: center; margin-bottom: 8px; }
      .hud-badge, .dock-round, .trash, .degrees, .producer {
        border: none; cursor: pointer;
        background: linear-gradient(#fffaf3, #f3ddc0);
        box-shadow: 0 4px 0 #d7b48a, 0 8px 16px rgba(90, 57, 40, 0.12);
      }
      .hud-badge { width: 58px; height: 58px; border-radius: 18px; position: relative; padding: 6px; }
      .hud-badge svg, .dock-round svg, .trash svg { width: 100%; height: 100%; }
      .hud-badge i, .producer em {
        position: absolute; top: -4px; right: -4px; min-width: 18px; height: 18px; border-radius: 999px;
        background: #e23b4a; color: white; font-size: 0.72rem; font-style: normal; font-weight: 800;
        display: grid; place-items: center; padding: 0 4px;
      }
      .meters { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
      .meter {
        display: flex; align-items: center; gap: 6px; min-width: 132px;
        background: linear-gradient(#fff, #fff6ea); border-radius: 999px; padding: 4px 4px 4px 8px;
        box-shadow: 0 3px 0 #e6cba6, inset 0 0 0 2px #fff;
      }
      .meter-icon { width: 28px; height: 28px; flex: none; display: grid; }
      .meter-icon svg { width: 100%; height: 100%; }
      .meter strong { display: block; font-size: 1rem; line-height: 1; }
      .meter small { display: block; color: #a56b32; font-size: 0.68rem; font-weight: 800; }
      .meter button {
        margin-left: auto; width: 26px; height: 26px; border: none; border-radius: 50%;
        background: #7dce55; color: white; font-weight: 800; cursor: pointer; box-shadow: 0 2px 0 #4e9a32;
      }
      .playfield { display: grid; gap: 8px; }
      .orders { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; }
      .claim {
        flex: 0 0 auto; border: none; border-radius: 16px; background: #fff4d6; color: #8a5a20;
        font-weight: 800; padding: 8px 10px; box-shadow: 0 3px 0 #e6c98a; cursor: pointer;
      }
      .claim:disabled { opacity: 0.7; cursor: default; }
      .order {
        position: relative; flex: 0 0 168px; display: flex; gap: 6px; text-align: left; border: none;
        border-radius: 18px; padding: 8px; background: linear-gradient(#fffaf4, #f8e7d2);
        box-shadow: 0 4px 0 #e2c3a2; color: inherit; cursor: pointer;
      }
      .order:disabled { cursor: default; }
      .order.ready { box-shadow: 0 0 0 3px #7dce55, 0 4px 0 #5eae3e; }
      .who { width: 46px; height: 46px; flex: none; }
      .who svg, .item svg, .ghost svg, .info .item svg { width: 100%; height: 100%; display: block; }
      .order-body { min-width: 0; display: grid; gap: 2px; }
      .order-body strong { font-size: 0.82rem; }
      .needs { display: flex; gap: 4px; }
      .need { display: grid; justify-items: center; }
      .need .item { width: 28px; height: 28px; }
      .need em { font-style: normal; font-size: 0.68rem; font-weight: 800; color: #a56b32; }
      .pay { font-size: 0.78rem; font-weight: 800; color: #c98416; }
      .pay::before { content: "● "; }
      .done-flag {
        position: absolute; left: 8px; right: 8px; bottom: 8px; background: #67c24a; color: white;
        font-weight: 800; text-align: center; border-radius: 8px; font-size: 0.72rem; letter-spacing: 0.04em;
      }
      .board-stack { min-width: 0; display: grid; gap: 8px; }
      .producers { display: flex; gap: 8px; }
      .producer {
        flex: 1; min-height: 64px; border-radius: 16px; display: grid;
        grid-template-columns: 42px 1fr; grid-template-rows: auto auto; column-gap: 6px;
        align-items: center; padding: 6px 8px; text-align: left; color: inherit; position: relative;
      }
      .producer .item { grid-row: 1 / span 2; width: 42px; height: 42px; }
      .producer strong { font-size: 0.9rem; }
      .producer em { position: static; background: transparent; color: #8a5a20; font-weight: 800; min-width: 0; height: auto; padding: 0; justify-self: start; }
      .producer.resting { opacity: 0.7; }
      .producer.kwiaty { background: linear-gradient(#fff0f5, #ffd6e4); }
      .producer.slodkosci { background: linear-gradient(#fff8ea, #ffe0b5); }
      .producer.listy { background: linear-gradient(#f7f1ff, #e4d6ff); }
      .play { min-width: 0; }
      .board {
        display: grid; gap: 4px; padding: 10px; border-radius: 26px;
        background: linear-gradient(#f8d7ad, #e7b57a);
        box-shadow: inset 0 0 0 4px #fff4e4, 0 8px 0 #d39a58; touch-action: none;
      }
      .cell {
        aspect-ratio: 1; border: none; border-radius: 12px; padding: 2px; position: relative;
        background: linear-gradient(#fffaf3, #f4e2cb); box-shadow: inset 0 -3px 0 rgba(176, 122, 70, 0.18); color: inherit;
      }
      .cell.filled { cursor: pointer; }
      .cell .item { width: 92%; height: 92%; margin: 0 auto; }
      .cell i {
        position: absolute; right: 2px; bottom: 1px; min-width: 14px; height: 14px; border-radius: 999px;
        background: rgba(255, 250, 243, 0.9); font-style: normal; font-size: 0.62rem; font-weight: 800; line-height: 14px; color: #8a5a20;
      }
      .cell.selected { box-shadow: inset 0 0 0 3px #3ea83a, inset 0 0 0 6px #d9f5c8; background: #e7f8dc; }
      .cell.mergeable { box-shadow: inset 0 0 0 3px #7dce55; background: #f3ffe8; }
      .cell.needed i { background: #ffe7a3; }
      .cell.locked {
        background: linear-gradient(135deg, #d8c3a5 25%, transparent 25%), linear-gradient(225deg, #c9b08d 25%, transparent 25%), #e7d3b4;
        background-size: 12px 12px; box-shadow: inset 0 0 0 2px #c4a57c; cursor: pointer;
      }
      .cell.pop .item { animation: pop 0.35s ease; }
      .dock { display: grid; grid-template-columns: 52px 1fr 52px 74px; gap: 8px; align-items: center; }
      .dock-round, .trash { width: 52px; height: 52px; border-radius: 16px; padding: 8px; }
      .trash { background: linear-gradient(#ff8d8d, #e85a6a); }
      .trash:disabled { opacity: 0.45; cursor: default; }
      .info {
        min-height: 58px; border-radius: 18px; background: linear-gradient(#fffaf3, #f7e6d0);
        box-shadow: 0 4px 0 #e2c3a2; display: flex; gap: 8px; align-items: center; padding: 6px 10px;
      }
      .info .item, .info-mark { width: 42px; height: 42px; flex: none; }
      .info-mark { display: grid; place-items: center; border-radius: 50%; background: #7dce55; color: white; font-weight: 800; font-size: 1.3rem; }
      .info strong, .info span { display: block; }
      .info span { color: #8a5a20; font-size: 0.78rem; }
      .degrees { height: 52px; border-radius: 16px; position: relative; overflow: hidden; color: #6a3e22; }
      .degrees span, .degrees strong { position: relative; z-index: 1; display: block; }
      .degrees strong { font-size: 1.1rem; }
      .degrees i { position: absolute; left: 0; bottom: 0; height: 5px; background: #e85a84; }
      .links { display: flex; justify-content: center; gap: 8px; margin-top: 8px; }
      .links a { color: #2f5d34; background: rgba(255, 255, 255, 0.55); text-decoration: none; font-weight: 800; font-size: 0.82rem; border-radius: 999px; padding: 6px 10px; }
      .ghost { position: fixed; width: 54px; height: 54px; margin: -27px 0 0 -27px; pointer-events: none; z-index: 20; filter: drop-shadow(0 8px 8px rgba(90, 57, 40, 0.25)); }
      .toast {
        position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); width: min(420px, calc(100% - 24px));
        background: #5a3928; color: white; border-radius: 16px; padding: 12px 14px; text-align: center; font-weight: 800; z-index: 40;
      }
      .toast[hidden] { display: none; }
      .mask { position: fixed; inset: 0; background: rgba(47, 77, 42, 0.45); display: flex; align-items: flex-end; justify-content: center; z-index: 30; padding: 12px; }
      .sheet { width: min(520px, 100%); max-height: min(82vh, 720px); overflow: auto; border-radius: 28px; padding: 16px; background: #fffaf3; box-shadow: 0 16px 40px rgba(47, 77, 42, 0.25); }
      .sheet h2 { margin: 0; font-family: "Segoe Script", "Comic Sans MS", cursive; font-size: 2.2rem; }
      .sheet > p { color: #8a5a20; }
      .offers { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
      .offers li { display: flex; gap: 8px; align-items: center; justify-content: space-between; background: white; border-radius: 16px; padding: 8px; }
      .offers strong, .offers span { display: block; }
      .offers span { color: #8a5a20; font-size: 0.82rem; }
      .offers button, .close { border: none; border-radius: 999px; background: linear-gradient(#8ed86a, #5eae3e); color: white; font-weight: 800; padding: 8px 12px; cursor: pointer; }
      .close { width: 100%; margin-top: 8px; padding: 12px; }
      .quiet { background: #eadfce; color: #6a3e22; }
      .offers button:disabled { background: #eadfce; color: #a08a74; cursor: default; }
      @keyframes pop { 0% { transform: scale(0.4); } 70% { transform: scale(1.12); } 100% { transform: scale(1); } }
      @media (min-width: 860px) {
        .garden { height: 100vh; overflow: hidden; }
        .table { height: 100vh; display: flex; flex-direction: column; padding-bottom: 8px; }
        .playfield { flex: 1; min-height: 0; grid-template-columns: 220px minmax(0, 1fr); align-items: stretch; }
        .orders { flex-direction: column; overflow: auto; }
        .order { flex: none; }
        .claim { width: 100%; }
        .board-stack { min-height: 0; height: 100%; grid-template-rows: auto minmax(0, 1fr) auto; }
        .play { min-height: 0; height: 100%; }
        .board { height: 100%; }
        .cell { aspect-ratio: auto; min-height: 0; }
        .links { display: none; }
        .mask { align-items: center; }
      }
      @media (max-width: 420px) {
        .hud { grid-template-columns: 48px 1fr 48px; }
        .hud-badge { width: 48px; height: 48px; }
        .meter { min-width: 0; flex: 1; }
        .vine { display: none; }
      }
      @media (prefers-reduced-motion: reduce) { .cell.pop .item { animation: none; } }
    </style>
  </head>
  <body>
    <div class="garden">
      <svg class="vine left" viewBox="0 0 180 900" aria-hidden="true">

      <main class="table" id="app"></main>
    </div>
    <div id="toast" class="toast" role="status" hidden></div>
    <div id="shop"></div>

    <script>
      const SAVE_KEY = "kroliczek-merge-v2";
      const MAX_ENERGY = 50;
      const REGEN_MS = 120000;
      const BASE_COLS = 7;
      const BASE_ROWS = 9;

        { id: "slodkosc_2", chain: "slodkosci", level: 2, sellValue: 2, name: "Krem" },
        { id: "slodkosc_3", chain: "slodkosci", level: 3, sellValue: 5, name: "Ciasteczko" },

        { id: "slodkosc_5", chain: "slodkosci", level: 5, sellValue: 28, name: "Słodka uczta" },
        { id: "slodkosc_6", chain: "slodkosci", level: 6, sellValue: 60, name: "Wieczór we dwoje" },
        { id: "list_1", chain: "listy", level: 1, sellValue: 1, name: "Karteczka" },
        { id: "list_2", chain: "listy", level: 2, sellValue: 2, name: "Liścik" },
        { id: "list_3", chain: "listy", level: 3, sellValue: 5, name: "Koperta" },
        { id: "list_4", chain: "listy", level: 4, sellValue: 12, name: "List miłosny" },
        { id: "list_5", chain: "listy", level: 5, sellValue: 28, name: "Wyznanie" },
        { id: "list_6", chain: "listy", level: 6, sellValue: 60, name: "Na zawsze" }
      ];
      const GENERATORS = [
        { id: "gen_kwiaty", chain: "kwiaty", energyCost: 1, spawnLevel: 1, cooldownSeconds: 24, maxCharges: 5, name: "Donica", blurb: "Płatki tylko dla niej" },
        { id: "gen_slodkosci", chain: "slodkosci", energyCost: 1, spawnLevel: 1, cooldownSeconds: 28, maxCharges: 4, name: "Kuchnia", blurb: "Coś słodkiego na potem" },
        { id: "gen_listy", chain: "listy", energyCost: 1, spawnLevel: 1, cooldownSeconds: 26, maxCharges: 5, name: "Biurko", blurb: "Słowa, które zostają" }

      const ORDERS = [
        { id: "pak-na-dzien-dobry", npc: "Króliczek", portrait: "kroliczek", line: "Dwa płatki. Jeszcze nic z nich nie rób, chcę je takie małe.", minLevel: 1, starter: true, requirements: [{ itemId: "kwiat_1", count: 2 }], rewardCoins: 6, rewardEnergy: 2, rewardXp: 5 },
        { id: "jagodki-do-herbaty", npc: "Konras", portrait: "konras", line: "Dwie jagódki. Zaniosę je Julii, zanim sam je zjem.", minLevel: 1, starter: true, requirements: [{ itemId: "slodkosc_1", count: 2 }], rewardCoins: 6, rewardEnergy: 2, rewardXp: 5 },

        { id: "pak-i-platek", npc: "Króliczek", portrait: "kroliczek", line: "Pąk i jeszcze jeden płatek. Jak my: jedno już nasze, drugie dopiero się otwiera.", minLevel: 1, requirements: [{ itemId: "kwiat_2", count: 1 }, { itemId: "kwiat_1", count: 1 }], rewardCoins: 10, rewardEnergy: 3, rewardXp: 8 },
        { id: "dwa-kremy", npc: "Konras", portrait: "konras", line: "Dwa kremy. Jeden na palec, drugi naprawdę do ciasta.", minLevel: 1, requirements: [{ itemId: "slodkosc_2", count: 2 }], rewardCoins: 12, rewardEnergy: 2, rewardXp: 8 },
        { id: "liscik", npc: "Gwiazdka", portrait: "gwiazdka", line: "Jeden liścik. Krótki. Byle było w nim jej imię.", minLevel: 1, requirements: [{ itemId: "list_2", count: 1 }], rewardCoins: 8, rewardEnergy: 2, rewardXp: 7 },
        { id: "roza-i-liscik", npc: "Króliczek", portrait: "kroliczek", line: "Różyczka i liścik. Kwiat bez słowa jest tylko ładny. Ja chcę oba.", minLevel: 2, requirements: [{ itemId: "kwiat_3", count: 1 }, { itemId: "list_2", count: 1 }], rewardCoins: 18, rewardEnergy: 4, rewardXp: 12 },
        { id: "dwa-ciastka", npc: "Konras", portrait: "konras", line: "Dwa ciasteczka. Jedno jej, drugie też jej. Ja patrzę.", minLevel: 2, requirements: [{ itemId: "slodkosc_3", count: 2 }], rewardCoins: 22, rewardEnergy: 3, rewardXp: 14 },
        { id: "roza-i-krem", npc: "Gwiazdka", portrait: "gwiazdka", line: "Różyczka obok kremu. Niech wieczór pachnie jednym i drugim.", minLevel: 2, requirements: [{ itemId: "kwiat_3", count: 1 }, { itemId: "slodkosc_2", count: 1 }], rewardCoins: 16, rewardEnergy: 3, rewardXp: 11 },
        { id: "bukiet-i-koperta", npc: "Króliczek", portrait: "kroliczek", line: "Bukiecik i koperta. Włożę jedno w drugie i udam, że to przypadek.", minLevel: 3, requirements: [{ itemId: "kwiat_4", count: 1 }, { itemId: "list_3", count: 1 }], rewardCoins: 36, rewardEnergy: 5, rewardXp: 20 },

        { id: "wyznanie-i-bukiet", npc: "Gwiazdka", portrait: "gwiazdka", line: "Wyznanie i bukiecik. Znam treść. I tak lubię, kiedy układasz je od nowa.", minLevel: 4, requirements: [{ itemId: "list_5", count: 1 }, { itemId: "kwiat_4", count: 1 }], rewardCoins: 75, rewardEnergy: 6, rewardXp: 34 },

        { id: "wieczor", npc: "Konras", portrait: "konras", line: "Wieczór we dwoje. Herbata stygnie, a ja nie.", minLevel: 5, requirements: [{ itemId: "slodkosc_6", count: 1 }], rewardCoins: 120, rewardEnergy: 10, rewardXp: 50 },
        { id: "na-zawsze", npc: "Gwiazdka", portrait: "gwiazdka", line: "Na zawsze i jeden tort. Żeby przysięga miała jakiś słodki dowód.", minLevel: 5, requirements: [{ itemId: "list_6", count: 1 }, { itemId: "slodkosc_4", count: 1 }], rewardCoins: 150, rewardEnergy: 12, rewardXp: 60 }
      ];
      const SEED = [
        "kwiat_1", "list_1", "slodkosc_1", "kwiat_2", "list_2", "slodkosc_2", "kwiat_1",
        "list_1", "kwiat_2", "slodkosc_1", null, "list_2", "kwiat_3", "slodkosc_1",

            </div>
          </div>
          <nav class="links"><a href="./bukiet.html">Bukiet</a><a href="./gift.html">Sto dni</a><a href="./cart.html">Koszyk</a></nav>`;
        paintToast();
        paintShop();
      }
      function paintToast() {
        const node = document.getElementById("toast");
        node.hidden = !state.toast;
        node.textContent = state.toast || "";
      }
      function paintShop() {
        const host = document.getElementById("shop");
        if (location.hash !== "#/shop") { host.innerHTML = ""; return; }
        const offers = shopOffers().map((offer) => {
          const affordable = state.coins >= offer.cost && !offer.maxed;
          return `<li><div><strong>${esc(offer.title)}</strong><span>${esc(offer.detail)}</span></div><button type="button" data-act="buy" data-id="${esc(offer.id)}" ${affordable ? "" : "disabled"}>${offer.maxed ? "Maks" : offer.cost}</button></li>`;
        }).join("");
        host.innerHTML = `<div class="mask" data-act="mask"><div class="sheet" role="dialog" aria-labelledby="shop-title"><h2 id="shop-title">Sklep całusów</h2><p>Masz ${state.coins} monet. Donica, kuchnia i biurko lubią, kiedy o nie dbasz.</p><ul class="offers">${offers}</ul><button type="button" class="close" data-act="close">Wracam do planszy</button><button type="button" class="close quiet" data-act="reset">Zacznij od nowa</button></div></div>`;
      }
      function patchTimers() {
        const remain = msUntilNext(state.energy, state.energyUpdatedAt, state.now);
        const meter = document.querySelector("[data-meter='energy']");
        if (meter) {
          meter.querySelector("strong").textContent = String(state.energy);
          meter.querySelector("small").textContent = state.energy >= MAX_ENERGY ? "pełna" : formatRemain(remain);
        }
        for (const config of GENERATORS) {
          const label = document.querySelector(`[data-charge="${config.id}"]`);
          if (!label) continue;
          const runtime = state.generators[config.id];
          const max = maxCharges(config, runtime);
          const seconds = runtime.nextChargeAt ? Math.max(0, Math.ceil((runtime.nextChargeAt - state.now) / 1000)) : 0;
          label.textContent = runtime.charges <= 0 ? `${seconds}s` : `${runtime.charges}/${max}`;
        }
      }

      function tapGenerator(id) {
        const now = Date.now();
        state.now = now;
        catchUp(now);
        const config = genById.get(id);
        const charged = spendCharge(config, state.generators[id], now);
        if (!charged) { writeSave(); say(`${config.name} zbiera oddech. Jeszcze chwila.`); render(); return; }
        const paid = spendEnergy(state.energy, state.energyUpdatedAt, config.energyCost, now);
        if (!paid) { writeSave(); say("Koszyczek energii jest pusty."); render(); return; }
        const spots = [];
        state.board.forEach((cell, index) => { if (!cell) spots.push(index); });
        if (!spots.length) { writeSave(); say("Plansza jest pełna. Połącz albo sprzedaj coś małego."); render(); return; }
        const item = itemFor(config.chain, config.spawnLevel);
        const index = spots[Math.floor(Math.random() * spots.length)];
        state.board = state.board.slice();
        state.board[index] = { uid: uid(), itemId: item.id };
        state.energy = paid.energy;
        state.energyUpdatedAt = paid.updatedAt;
        state.generators = { ...state.generators, [id]: charged };
        state.sawHint = true;
        state.selected = null;
        writeSave();
        pulse(index);
        say(`${item.name} wskakuje na planszę.`);
        render();
      }
      function dropOn(from, to) {
        if (from === to || !state.board[from]) return;
        const source = state.board[from];
        const target = state.board[to];
        if (!target) {
          const board = state.board.slice();
          board[to] = source;
          board[from] = null;
          state.board = board;
          state.selected = null;
          writeSave();
          render();
          return;
        }
        if (source.itemId === target.itemId) {
          const upgraded = nextItem(source.itemId);
          if (!upgraded) { say(`${itemOf(source.itemId).name} jest już najsłodszym poziomem.`); return; }
          const board = state.board.slice();
          board[from] = null;
          board[to] = { uid: uid(), itemId: upgraded.id };
          state.board = board;
          state.selected = null;
          writeSave();
          pulse(to);
          say(`Połączenie: ${upgraded.name}.`);
          render();
          return;
        }
        const board = state.board.slice();
        board[from] = target;
        board[to] = source;
        state.board = board;
        state.selected = null;
        writeSave();
        render();
      }
      function deliver(orderUid) {
        const now = Date.now();
        state.now = now;
        catchUp(now);
        const active = state.orders.find((order) => order.uid === orderUid);
        if (!active) return;
        const template = orderById.get(active.templateId);
        if (!canDeliver(state.board, template.requirements)) { say("Jeszcze nie ma kompletu."); return; }
        const board = takeRequirements(state.board, template.requirements);
        const progress = addXp(state.level, state.xp, template.rewardXp);
        const energy = Math.min(MAX_ENERGY, state.energy + template.rewardEnergy);
        const replacement = pickTemplates([...state.orders.filter((order) => order.uid !== orderUid).map((order) => order.templateId), active.templateId], progress.level, 1)[0];
        state.board = board;
        state.coins += template.rewardCoins;
        state.energy = energy;
        state.energyUpdatedAt = energy >= MAX_ENERGY ? now : state.energyUpdatedAt;
        state.level = progress.level;
        state.xp = progress.xp;
        state.orders = state.orders.map((order) => order.uid === orderUid ? { uid: uid(), templateId: replacement.id } : order);
        state.selected = null;
        writeSave();
        say(`${template.npc} bierze to do serca. +${template.rewardCoins} monet.`);
        render();
      }
      function buy(offerId) {
        const now = Date.now();
        state.now = now;
        catchUp(now);
        const offer = shopOffers().find((entry) => entry.id === offerId);
        if (!offer) return;
        if (!applyOffer(offer, now)) { say(offer.maxed ? "To już kupione na dobre." : "Brakuje monet."); render(); return; }
        writeSave();
        say(`Kupione: ${offer.title}.`);
        render();
      }
      function sellSelected() {
        if (state.selected == null) return;
        const cell = state.board[state.selected];
        if (!cell) return;
        const item = itemOf(cell.itemId);
        state.board = state.board.slice();
        state.board[state.selected] = null;
        state.coins += item.sellValue;
        state.selected = null;
        writeSave();
        say(`${item.name} za ${item.sellValue} monet.`);
        render();
      }
      function resetGame() {
        if (!window.confirm("Zacząć od nowa? Zapis zniknie.")) return;
        try { localStorage.removeItem(SAVE_KEY); } catch { /* ignore */ }
        Object.assign(state, createFresh(Date.now()));
        state.now = Date.now();
        state.selected = null;
        state.pulse = null;
        writeSave();
        say("Czysta plansza. Zaczynamy od płatka.");
        render();
      }

      const drag = { active: null };
      document.addEventListener("pointerdown", (event) => {
        const cell = event.target.closest("[data-i]");
        if (!cell || !document.getElementById("app").contains(cell) || event.button > 0) return;
        const index = Number(cell.dataset.i);
        if (!state.board[index]) {
          if (state.selected != null) dropOn(state.selected, index);
          return;
        }
        drag.active = { index, x: event.clientX, y: event.clientY, dragging: false };
        event.preventDefault();
      });
      window.addEventListener("pointermove", (event) => {
        const active = drag.active;
        if (!active) return;
        const dx = event.clientX - active.x;
        const dy = event.clientY - active.y;
        const ghost = document.getElementById("ghost");
        if (!active.dragging && dx * dx + dy * dy > 36) {
          active.dragging = true;
          const item = itemOf(state.board[active.index].itemId);
          ghost.className = "ghost";
          ghost.innerHTML = itemSvg(item);
        }
        if (active.dragging) {
          ghost.style.left = `${event.clientX}px`;
          ghost.style.top = `${event.clientY}px`;
        }
      });
      window.addEventListener("pointerup", (event) => {
        const active = drag.active;
        if (!active) return;
        drag.active = null;
        const ghost = document.getElementById("ghost");
        ghost.className = "";
        ghost.innerHTML = "";
        if (active.dragging) {
          const hit = document.elementFromPoint(event.clientX, event.clientY)?.closest("[data-i]");
          if (hit) dropOn(active.index, Number(hit.dataset.i));
          return;
        }
        if (state.selected == null) { state.selected = active.index; render(); }
        else if (state.selected === active.index) { state.selected = null; render(); }
        else dropOn(state.selected, active.index);
      });
      document.addEventListener("click", (event) => {
        const mask = event.target.closest("[data-act='mask']");
        if (mask && event.target === mask) { location.hash = "#/"; return; }
        const node = event.target.closest("[data-act]");
        if (!node) return;
        const act = node.dataset.act;
        if (act === "shop") { location.hash = "#/shop"; paintShop(); }
        else if (act === "close") { location.hash = "#/"; paintShop(); }
        else if (act === "gen") tapGenerator(node.dataset.id);
        else if (act === "deliver") deliver(node.dataset.id);
        else if (act === "claim") { const first = readyOrders()[0]; if (first) deliver(first.uid); }
        else if (act === "sell") sellSelected();
        else if (act === "buy") buy(node.dataset.id);
        else if (act === "reset") resetGame();
      });
      window.addEventListener("hashchange", paintShop);
      window.setInterval(() => {
        const beforeEnergy = state.energy;
        const beforeGen = JSON.stringify(state.generators);
        state.now = Date.now();
        catchUp(state.now);
        if (state.energy !== beforeEnergy || JSON.stringify(state.generators) !== beforeGen) {
          writeSave();
          render();
        } else patchTimers();
      }, 1000);

      render();
    </script>
  </body>
</html>
