<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Performance duo!</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">

    <style>
        * {
            padding: 0;
            margin: 0;
            border: none;
            outline: none;
            font-family: "Exo 2", sans-serif;
            font-optical-sizing: auto;
            user-select: none;
        }


        body {
            background-color: #fbfdfc;
        }

        main {
            display: flex;
            flex-direction: column;
            max-width: 320px;
            margin: 30px auto;
            gap: 0.5rem;
            justify-content: center;
            align-items: center;
        }

        #clock {
            font-size: 3.5rem;
        }

        .img-box {
            max-width: 320px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .img-box img {
            width: 100%;
            height: 100%;
        }

        .img-box img:active {
            width: 90%;
            height: 90%;
        }

        .goto-box {
            display: grid;
            grid-template-columns: repeat(3, 90px);
            gap: 12px;
            justify-content: center;
            align-items: center;
            margin: 22px 0 8px;
        }

        .link-box {
            width: 90px;
            height: 90px;
            border-radius: 15px;
        }

        .link-box img {
            width: 100%;
            height: 100%;
            border-radius: 15px;
        }

        .flower-link {
            background: linear-gradient(160deg, #ffe7ef, #ffc2d6);
            box-shadow: 0 8px 18px rgba(226, 91, 126, 0.28);
            animation: flower-bob 2.8s ease-in-out infinite;
        }

        .flower-link a {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .flower-icon {
            width: 68px;
            height: 68px;
            filter: drop-shadow(0 4px 0 rgba(196, 70, 110, 0.15));
        }

        .flower-link:active {
            transform: scale(0.92);
        }

        @keyframes flower-bob {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-4px); }
        }

        .header {
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            gap: 20px;
        }

        .logo-box img {
            width: 60px;
            height: 60px;
        }
    </style>
</head>

<body>
    <main>
        <div class="header">
            <div class="logo-box">
                <img src="assets/logo.png" alt="">
            </div>
            <div class="time-box">
                <p id="clock"></p>
            </div>
        </div>
        <div class="img-box">
            <img src="assets/64d58b037a8c7f81338494a49ede2975.jpg" alt="pix">
        </div>
        <div class="goto-box">
            <div class="link-box"><a href="cart.html"><img src="assets/home.png" alt="Koszyk"></a></div>
            <div class="link-box flower-link">
                <a href="bukiet.html" aria-label="Bukiet dla Króliczka">
                    <svg class="flower-icon" viewBox="0 0 64 64" aria-hidden="true">
                        <path d="M32 36c0 8 1 12 2 18" fill="none" stroke="#4f7d56" stroke-width="2.4" stroke-linecap="round"/>
                        <ellipse cx="24" cy="50" rx="8" ry="3.6" fill="#7eae80" transform="rotate(-30 24 50)"/>
                        <g transform="translate(32 26)">
                            <ellipse cy="-11" rx="7" ry="11" fill="#ff8aab"/>
                            <ellipse cy="-11" rx="7" ry="11" fill="#f26d92" transform="rotate(60)"/>
                            <ellipse cy="-11" rx="7" ry="11" fill="#ffc2d4" transform="rotate(120)"/>
                            <ellipse cy="-11" rx="7" ry="11" fill="#e85a84" transform="rotate(180)"/>
                            <ellipse cy="-11" rx="7" ry="11" fill="#ff9ebb" transform="rotate(240)"/>
                            <ellipse cy="-11" rx="7" ry="11" fill="#f48aaa" transform="rotate(300)"/>
                            <circle r="6.5" fill="#ffe7a3"/>
                            <circle r="2.8" fill="#fffaf3"/>
                        </g>
                    </svg>
                </a>
            </div>
            <div class="link-box"><a href="gift.html"><img src="assets/gift.png" alt="Prezent"></a></div>
        </div>
        <div class="footer"></div>
    </main>
</body>

<script>
    function updateClock() {
        const now = new Date();
        const hours = String(now.getHours()).padStart(2, '0');
        const minutes = String(now.getMinutes()).padStart(2, '0');
        const seconds = String(now.getSeconds()).padStart(2, '0');

        const timeString = `${hours}:${minutes}:${seconds}`;
        document.getElementById('clock').textContent = timeString;
    }

    setInterval(updateClock, 1000);
    updateClock(); 
</script>

</html>
